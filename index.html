<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Nomenklatur Generator</title>

<style>
  body { font-family: Arial; padding: 20px;}

  label {
    display: grid;
    grid-template-columns: 120px 300px;
    align-items: center;
    margin-top: 10px;
  }

  input, select {
    padding: 6px;
    width: 100%;
    box-sizing: border-box;
  }

  .hint {
    grid-column: 2;
    font-size: 12px;
    color: gray;
    margin-top: 2px;
  }

  #output {
    margin-top: 15px;
    font-weight: bold;
    width: 320px;
  }

  button {
    width: 320px;
    margin-top: 10px;
    padding: 6px 10px;
  }

  .big {
    font-size: 20px;
  }
</style>

</head>
<body>

<h3>Nomenklatur Generator</h3>

<label>
  <span>Semester:</span>
  <input type="text" id="semester" value="26s">
  <div class="hint">Format: Jahr + s (Sommer) oder w (Winter)</div>
</label>

<label>
  <span>Studiengang:</span>
  <select id="Studiengang_gruppe"></select>
</label>

<label>
  <span>Laborgruppe:</span>
  <select id="gruppe"></select>
  <div class="hint">EX = Wiederholer und andere Personen</div>
</label>

<label>
  <span>Listennummer:</span>
  <input type="number" id="liste" min="1" max="99" value="1">
  <div class="hint">Teilnehmernummer in deiner Gruppe</div>
</label>

<label>
  <span>Aufgabe:</span>
  <select id="aufgabe"></select>
</label>

<label>
  <span>Bauteil:</span>
  <input type="number" id="teil" min="0" max="9" value="0">
</label>

<label>
  <span>Version:</span>
  <input type="text" id="version" value="A">
  <div class="hint">
    Nach erster Änderung wird ein Buchstabe angefügt.<br>
    A = Abgabe<br>
    B = 1. Änderung<br>
    C, ...
  </div>
</label>

<button onclick="generieren()">Erstellen</button>

<br><br><br>

<div>
  <label class="big">Output:</label>
  <input type="text" id="output" readonly>
  <br>
  <button onclick="kopieren()">Kopieren</button>
  <span id="copyStatus" style="margin-left:10px; color:green;"></span>
</div>

<script>

//////////////////////////////
// 🔧 CONFIG (HIER EDITIEREN)
//////////////////////////////

const CONFIG = {
  studiengaenge: ["W2"],

  gruppen: ["A2","A1","B3","B4","C5","C6","D7","EX"],

  aufgaben: [
    { value: "01", text: "1. Normschrift" },
    { value: "02", text: "2. Klauenkupplung" },
    { value: "03", text: "3. Zentrierteil" },
    { value: "04", text: "4. Welle" },
    { value: "05", text: "5. Wellenbaugruppe Schneckengetriebe" }
  ]
};

//////////////////////////////
// 🔧 CONFIG ENDE
//////////////////////////////

function fillSorted(selectId, array) {
  let sorted = [...new Set(array)].sort();
  let select = document.getElementById(selectId);

  sorted.forEach(item => {
    let opt = document.createElement("option");
    opt.text = item;
    opt.value = item;
    select.add(opt);
  });
}

function fillAufgaben() {
  let select = document.getElementById("aufgabe");

  CONFIG.aufgaben.forEach(item => {
    let opt = document.createElement("option");
    opt.value = item.value;
    opt.text = item.text;
    select.add(opt);
  });
}

function pad(num) {
  return num.toString().padStart(2, '0');
}

function generieren() {
  let s = document.getElementById("semester").value;
  let st = document.getElementById("Studiengang_gruppe").value;
  let g = document.getElementById("gruppe").value;
  let l = pad(document.getElementById("liste").value);
  let a = document.getElementById("aufgabe").value;
  let t = pad(document.getElementById("teil").value);
  let v = document.getElementById("version").value.trim().toUpperCase();

  if (a === "01" || a === "02") {
    t = "00";
  }

  let name = `${s}-${st}${g}-${l}-${a}${t}`;

  if (v !== "") {
    name += `-${v}`;
  }

  document.getElementById("output").value = name;
}

function kopieren() {
  let text = document.getElementById("output").value;
  if (text === "") return;

  navigator.clipboard.writeText(text).then(() => {
    document.getElementById("copyStatus").innerText = "Kopiert!";
    setTimeout(() => {
      document.getElementById("copyStatus").innerText = "";
    }, 1500);
  });
}

//////////////////////////////
// 🔧 INIT
//////////////////////////////

fillSorted("Studiengang_gruppe", CONFIG.studiengaenge);
fillSorted("gruppe", CONFIG.gruppen);
fillAufgaben();

</script>

</body>
</html>
